version: '3.8'

networks:
  scaleup_network:
    name: scaleup_biz_network
    driver: bridge

volumes:
  postgres_data_dev:
    name: scaleup_biz_postgres_data_dev
  redis_data_dev:
    name: scaleup_biz_redis_data_dev

services:
  postgres:
    image: postgres:16.2-alpine
    container_name: scaleup_postgres_dev
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    networks:
      - scaleup_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: scaleup_redis_dev
    volumes:
      - redis_data_dev:/data
    networks:
      - scaleup_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5